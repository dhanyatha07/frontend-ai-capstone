<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="settings-container">
    <h1>Settings</h1>

    <form id="settings-form" novalidate>
      <fieldset>
        <legend>Profile</legend>

        <label for="display-name">Display name</label>
        <input type="text" id="display-name" name="displayName" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </fieldset>

      <fieldset>
        <legend>Preferences</legend>

        <label for="theme">Theme</label>
        <select id="theme" name="theme">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="system">System</option>
        </select>

        <label for="language">Language</label>
        <select id="language" name="language">
          <option value="en">English</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
        </select>
      </fieldset>

      <fieldset>
        <legend>Notifications</legend>

        <label class="checkbox-label">
          <input type="checkbox" id="email-notifications" name="emailNotifications">
          Email notifications
        </label>

        <label class="checkbox-label">
          <input type="checkbox" id="push-notifications" name="pushNotifications">
          Push notifications
        </label>
      </fieldset>

      <div class="form-actions">
        <button type="submit">Save settings</button>
        <button type="reset">Reset</button>
      </div>

      <p id="form-message" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="js/settings.js"></script>
</body>
</html>
