<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="settings-page">
    <header class="settings-header">
      <h1>Settings</h1>
      <p class="settings-intro">Manage your profile, preferences, and notifications.</p>
    </header>

    <div id="form-status" class="form-status" role="status" aria-live="polite"></div>

    <form id="settings-form" class="settings-form" novalidate>
      <fieldset class="form-section">
        <legend>Profile</legend>

        <div class="form-field">
          <label for="display-name">Display name</label>
          <input
            type="text"
            id="display-name"
            name="displayName"
            autocomplete="name"
            required
            aria-required="true"
          >
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
            aria-required="true"
          >
        </div>
      </fieldset>

      <fieldset class="form-section">
        <legend>Preferences</legend>

        <div class="form-field">
          <span class="field-label" id="theme-label">Theme</span>
          <div class="radio-group" role="radiogroup" aria-labelledby="theme-label">
            <label class="radio-option">
              <input type="radio" name="theme" value="light">
              Light
            </label>
            <label class="radio-option">
              <input type="radio" name="theme" value="dark">
              Dark
            </label>
            <label class="radio-option">
              <input type="radio" name="theme" value="system" checked>
              System
            </label>
          </div>
        </div>

        <div class="form-field">
          <label for="language">Language</label>
          <select id="language" name="language">
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
          </select>
        </div>
      </fieldset>

      <fieldset class="form-section">
        <legend>Notifications</legend>

        <div class="form-field form-field--checkbox">
          <label class="checkbox-option">
            <input type="checkbox" id="email-notifications" name="emailNotifications">
            Email notifications
          </label>
        </div>

        <div class="form-field form-field--checkbox">
          <label class="checkbox-option">
            <input type="checkbox" id="push-notifications" name="pushNotifications">
            Push notifications
          </label>
        </div>
      </fieldset>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save settings</button>
        <button type="button" id="reset-btn" class="btn btn-secondary">Reset</button>
      </div>
    </form>
  </main>

  <script src="js/settings.js"></script>
</body>
</html>
